<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Akki">
  <title>Akki</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Gold colour used by every icon (see styles.css: .ic) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="akkiGold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="24">
        <stop offset="0" stop-color="#fff0b8"/><stop offset="0.38" stop-color="#e2bd62"/>
        <stop offset="0.7" stop-color="#b98a30"/><stop offset="1" stop-color="#7d5a18"/>
      </linearGradient>
    </defs>
  </svg>
  <div id="app" aria-live="polite"></div>
  <div id="overlay"></div>
  <noscript>Akki needs JavaScript to run.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
